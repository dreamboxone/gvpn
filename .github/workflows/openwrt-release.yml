name: OpenWrt GVPN release

on:
  workflow_dispatch:
  push:
    tags:
      - 'openwrt-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ipq40xx/chromium
            release: 25.12.5
            fmt: apk
            sdk: openwrt-sdk-25.12.5-ipq40xx-chromium_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            sha256: 09fec3a23a8cac4156bc976550a71542abdf0abf7e9aba0a6e869b9c0184e637
            arch: arm_cortex-a7_neon-vfpv4
            rust_target: armv7-unknown-linux-musleabihf
            label: arm_cortex-a7_neon-vfpv4
          - target: mediatek/filogic
            release: 25.12.5
            fmt: apk
            sdk: openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sha256: ff4a38a397caa2cfe1c39e18f84ddede14878221b3593c3f2c4cfe24e3ec4c25
            arch: aarch64_cortex-a53
            rust_target: aarch64-unknown-linux-musl
            label: aarch64_cortex-a53
          - target: armsr/armv8
            release: 25.12.5
            fmt: apk
            sdk: openwrt-sdk-25.12.5-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sha256: 1b0316604a3e820b2b008a1baff3f9dac6716af942bef800930e58c7de98c98b
            arch: aarch64_generic
            rust_target: aarch64-unknown-linux-musl
            label: aarch64_generic
          # OpenWrt 24.10 still uses opkg/IPK, so the same three package
          # architectures need a second set of builds for those routers.
          - target: ipq40xx/generic
            release: 24.10.8
            fmt: ipk
            sdk: openwrt-sdk-24.10.8-ipq40xx-generic_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
            sha256: b1b6a4a0d18305431c005af5b3750bedcdc4f5578eb757c53a4ce5956337f9f2
            arch: arm_cortex-a7_neon-vfpv4
            rust_target: armv7-unknown-linux-musleabihf
            label: arm_cortex-a7_neon-vfpv4-24.10
          - target: mediatek/filogic
            release: 24.10.8
            fmt: ipk
            sdk: openwrt-sdk-24.10.8-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sha256: d9fd074f281823a3023e8f6a73aaac598018c898ec9ac4d1c507b596930d7482
            arch: aarch64_cortex-a53
            rust_target: aarch64-unknown-linux-musl
            label: aarch64_cortex-a53-24.10
          - target: armsr/armv8
            release: 24.10.8
            fmt: ipk
            sdk: openwrt-sdk-24.10.8-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sha256: 5f430f5b30c9ea6dc472710356c139abf916b7ebd5de14e108e9cc204f40a2a4
            arch: aarch64_generic
            rust_target: aarch64-unknown-linux-musl
            label: aarch64_generic-24.10
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libssl-dev pkg-config zstd curl git python3
          rustup target add '${{ matrix.rust_target }}'
      - name: Download matching OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          url="https://downloads.openwrt.org/releases/${{ matrix.release }}/targets/${{ matrix.target }}/${{ matrix.sdk }}"
          curl --fail --location --retry 5 --retry-all-errors --output sdk.tar.zst "$url"
          printf '%s  %s\n' '${{ matrix.sha256 }}' sdk.tar.zst | sha256sum --check
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
      - name: Prepare SDK feeds
        shell: bash
        run: |
          set -euo pipefail
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          if [ '${{ matrix.fmt }}' = apk ]; then
            grep -Fqx 'CONFIG_USE_APK=y' .config
          elif grep -Fqx 'CONFIG_USE_APK=y' .config; then
            echo "SDK ${{ matrix.release }} builds APK but this entry expects IPK" >&2
            exit 1
          fi
          grep -Fqx 'CONFIG_TARGET_ARCH_PACKAGES="${{ matrix.arch }}"' .config
      - name: Build and inspect package
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/build-openwrt.sh "$GITHUB_WORKSPACE/sdk"
          bash ./scripts/test-openwrt-package.sh "$GITHUB_WORKSPACE/sdk"
          package=(dist/openwrt/${{ matrix.arch }}/luci-app-gvpn-*.${{ matrix.fmt }})
          test "${#package[@]}" -eq 1
          mkdir -p release
          cp "${package[0]}" "release/luci-app-gvpn-${{ matrix.label }}.${{ matrix.fmt }}"
          sha256sum release/*.${{ matrix.fmt }} > release/SHA256SUMS-${{ matrix.label }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: openwrt-*
          path: release
          merge-multiple: true
      - name: Publish every target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^PKG_VERSION:=//p' openwrt/package/luci-app-gvpn/Makefile)
          revision=$(sed -n 's/^PKG_RELEASE:=//p' openwrt/package/luci-app-gvpn/Makefile)
          tag="openwrt-v${version}-r${revision}"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package $tag" >&2
            exit 1
          fi
          test "$(find release -maxdepth 1 -name '*.apk' | wc -l)" -eq 3
          test "$(find release -maxdepth 1 -name '*.ipk' | wc -l)" -eq 3
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            notes=$(printf '%s\n' \
              'Packages are named after the package architecture they target, not the board. Check the router with `apk --print-arch` (25.x) or `opkg print-architecture` (24.10).' \
              '' \
              'Pick `.apk` for APK-based OpenWrt 25.x, or `*-24.10.ipk` for opkg-based OpenWrt 24.10.' \
              '' \
              '- `arm_cortex-a7_neon-vfpv4` — ARMv7, e.g. ipq40xx (Google Wifi).' \
              '- `aarch64_cortex-a53` — ARMv8 Cortex-A53, e.g. mediatek/filogic and qualcommax/ipq807x (Linksys MX4200).' \
              '- `aarch64_generic` — generic AArch64, e.g. armsr/armv8; also runs on ARMv9 CPUs on that target.' \
              '' \
              'Install only on firmware whose package format and architecture both match.')
            gh release create "$tag" release/* --target "$GITHUB_SHA" \
              --title "GVPN for OpenWrt ${version}-r${revision}" \
              --notes "$notes"
          fi
